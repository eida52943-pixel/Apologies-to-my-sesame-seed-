<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اعتذار</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== الألوان: غيّرها من هنا ===== */
  :root {
    --bg1: #efe3f1;
    --bg2: #f7d9df;
    --ink: #3a2447;
    --soft: #6e5a78;
    --rose: #c2456b;
    --paper: #fffaf8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .letter {
    width: min(100%, 460px);
    background: var(--paper);
    border-radius: 6px 28px 6px 28px;
    padding: 36px 28px 30px;
    box-shadow: 0 18px 40px rgba(90, 40, 80, .18);
    border-right: 6px solid var(--rose);
    animation: rise .9s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  h1 {
    font-family: "Aref Ruqaa", "Traditional Arabic", serif;
    font-size: 2.2rem;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  p { line-height: 2; font-size: 1.05rem; color: var(--soft); margin-bottom: 12px; }
  .sign { color: var(--ink); font-weight: 500; margin-top: 20px; }
  .ask {
    font-family: "Aref Ruqaa", serif;
    font-size: 1.5rem;
    margin: 26px 0 14px;
    color: var(--ink);
  }
  .actions { position: relative; height: 96px; }
  button {
    font: inherit;
    font-size: 1.05rem;
    border: 0;
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #yes { background: var(--rose); color: #fff; }
  #yes:hover { filter: brightness(1.08); }
  #no {
    background: #ece3ee;
    color: var(--soft);
    position: absolute;
    top: 0;
    inset-inline-start: 150px;
    transition: top .25s, inset-inline-start .25s;
  }
  #thanks { display: none; text-align: center; }
  #thanks h2 { font-family: "Aref Ruqaa", serif; font-size: 2rem; margin-bottom: 8px; }
  .heart {
    position: fixed;
    bottom: -30px;
    font-size: 26px;
    animation: float 3s ease-in forwards;
    pointer-events: none;
  }
  @keyframes float { to { transform: translateY(-110vh) rotate(20deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .letter, .heart { animation: none; }
    .heart { display: none; }
  }
</style>
</head>
<body>
  <main class="letter">
    <div id="ask-box">
      <!-- غيّر الاسم والكلام زي ما تحب -->
      <h1>إلى مدرستي الغالية <span id="name">سماء</span>،</h1>
      <p>بعتذرلك على اللي حصل. تصرفي مكانش في محله، ومكنتش أقصد أضايقك أو أقلل من احترامك.</p>
      <p>بقدّر تعبك وصبرك معايا، وهاخد بالي إن ده ميتكررش.</p>
      <p class="sign">اعتذاري من قلبي، مع كامل الاحترام.</p>

      <div class="ask">تقبلي اعتذاري؟</div>
      <div class="actions">
        <button id="yes">أيوه، مقبول 💛</button>
        <button id="no">لأ</button>
      </div>
    </div>

    <div id="thanks">
      <h2>شكرًا إنك قبلتي اعتذاري 💛</h2>
      <p>وعد مني إن ده ميتكررش.</p>
    </div>
  </main>

<script>
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const box = document.querySelector('.actions');

  // زرار "لأ" بيهرب
  function dodge() {
    const w = box.clientWidth - no.offsetWidth;
    no.style.insetInlineStart = Math.random() * w + 'px';
    no.style.top = Math.random() * (box.clientHeight - no.offsetHeight) + 'px';
  }
  no.addEventListener('mouseenter', dodge);
  no.addEventListener('touchstart', e => { e.preventDefault(); dodge(); });
  no.addEventListener('click', dodge);

  // زرار "أيوه"
  yes.addEventListener('click', () => {
    document.getElementById('ask-box').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
    for (let i = 0; i < 24; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = ['💛', '🤍', '💗'][i % 3];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDelay = Math.random() * 1.2 + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 5000);
    }
  });
</script>
</body>
</html>
